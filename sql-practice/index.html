<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Practice — 100 Questions</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e1e4e8;min-height:100vh}
a{color:#58a6ff}

/* Layout */
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}
.sidebar{background:#161b22;border-right:1px solid #21262d;overflow-y:auto;padding:16px}
.main{overflow-y:auto;padding:32px 40px}

/* Sidebar */
.sidebar h2{font-size:15px;color:#58a6ff;margin-bottom:4px}
.sidebar .sub{font-size:11px;color:#484f58;margin-bottom:16px}
.progress-bar{height:6px;background:#21262d;border-radius:3px;margin-bottom:16px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#238636,#2ea043);border-radius:3px;transition:width 0.4s}
.progress-text{font-size:11px;color:#484f58;margin-bottom:20px}
.section-label{font-size:11px;font-weight:600;color:#484f58;text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px;padding-top:8px;border-top:1px solid #21262d}
.q-list{list-style:none}
.q-list li{font-size:13px;padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:2px;transition:background 0.2s}
.q-list li:hover{background:#21262d}
.q-list li.active{background:#1f6feb22;color:#58a6ff}
.q-list li .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid #484f58;flex-shrink:0}
.q-list li.solved .dot{background:#2ea043;border-color:#2ea043}
.q-list li .num{color:#484f58;min-width:22px}

/* Difficulty badges */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-easy{background:#23863622;color:#2ea043}
.badge-medium{background:#d2992222;color:#d29922}
.badge-hard{background:#f8514922;color:#f85149}

/* Main content */
.q-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.q-header h1{font-size:22px;font-weight:600}
.concept-tag{background:#1f6feb22;color:#58a6ff;padding:3px 10px;border-radius:10px;font-size:12px}

.q-description{font-size:15px;color:#c9d1d9;line-height:1.7;margin-bottom:24px;max-width:800px}
.q-description code{background:#21262d;padding:2px 6px;border-radius:4px;font-size:13px;color:#ff7b72}

/* Tables */
.table-section{margin-bottom:24px}
.table-section h3{font-size:13px;color:#8b949e;margin-bottom:8px;font-weight:600}
.schema-table{border-collapse:collapse;font-size:13px;margin-bottom:16px;background:#161b22;border-radius:8px;overflow:hidden}
.schema-table th{background:#21262d;padding:8px 14px;text-align:left;color:#8b949e;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.5px}
.schema-table td{padding:7px 14px;border-top:1px solid #21262d;color:#c9d1d9}
.schema-table tr:hover td{background:#1c2128}

/* Editor */
.editor-section{margin-bottom:20px}
.editor-label{font-size:12px;color:#8b949e;margin-bottom:6px;font-weight:600}
textarea.sql-input{width:100%;max-width:800px;min-height:100px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;font-family:'Cascadia Code','Fira Code',monospace;font-size:14px;padding:14px;resize:vertical;outline:none;transition:border-color 0.2s}
textarea.sql-input:focus{border-color:#58a6ff}

/* Buttons */
.btn-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.btn{padding:8px 18px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;font-family:inherit}
.btn:hover{background:#30363d}
.btn-primary{background:#238636;border-color:#238636;color:#fff}
.btn-primary:hover{background:#2ea043}
.btn-hint{background:#1f6feb22;border-color:#1f6feb44;color:#58a6ff}
.btn-hint:hover{background:#1f6feb33}
.btn-answer{background:#d2992222;border-color:#d2992244;color:#d29922}
.btn-answer:hover{background:#d2992233}

/* Feedback */
.feedback{padding:14px 18px;border-radius:8px;font-size:14px;margin-bottom:20px;display:none;max-width:800px}
.feedback.correct{display:block;background:#23863622;border:1px solid #23863644;color:#2ea043}
.feedback.wrong{display:block;background:#f8514922;border:1px solid #f8514944;color:#f85149}
.feedback.hint{display:block;background:#1f6feb15;border:1px solid #1f6feb33;color:#8b949e}
.feedback.answer{display:block;background:#d2992215;border:1px solid #d2992233;color:#c9d1d9}
.feedback code{background:#21262d;padding:2px 6px;border-radius:4px;font-family:'Cascadia Code','Fira Code',monospace;font-size:13px}

/* Expected output */
.expected{margin-top:16px}
.expected h3{font-size:13px;color:#8b949e;margin-bottom:8px;font-weight:600}

/* Nav buttons */
.nav-row{display:flex;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid #21262d}

/* Responsive */
@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .main{padding:20px}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <h2>🗄️ SQL Practice</h2>
    <div class="sub">100 Questions · Learn by Doing</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0 / 50 solved</div>
    <div id="qList"></div>
  </div>
  <div class="main" id="main"></div>
</div>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
